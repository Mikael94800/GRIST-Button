<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Création d'un Contact Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 16px; background-color: #f8fafc; font-size: 14.5px; }
    .form-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; max-width: 950px; margin: 0 auto; }
    .card-title { font-size: 20px; font-weight: bold; color: #1f2937; margin-bottom: 16px; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
    .section-title { font-size: 15px; font-weight: bold; color: #111827; margin-top: 16px; margin-bottom: 8px; border-bottom: 2px solid #3b82f6; padding-bottom: 4px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 8px; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group.full { grid-column: span 2; }
    label { font-size: 12px; font-weight: bold; color: #4b5563; text-transform: uppercase; }
    input[type="text"], select, textarea { padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; width: 100%; outline: none; background: #fff; }
    input:focus, select:focus, textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    input.invalid-email { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    input.valid-email { border-color: #10b981 !important; background-color: #f0fdf4 !important; }
    .email-msg { font-size: 11px; margin-top: 2px; font-weight: bold; }
    .email-msg.error { color: #dc2626; }
    .email-msg.success { color: #16a34a; }
    .checkbox-group { border: 1px solid #d1d5db; border-radius: 4px; padding: 8px; background: #f9fafb; max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; cursor: pointer; }
    .btn-submit { background-color: #16a34a; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; }
    .btn-submit:hover { background-color: #15803d; }
    #debug-box { margin-top: 15px; padding: 10px; background: #fef2f2; border: 1px solid #ef4444; border-radius: 4px; color: #991b1b; font-family: monospace; font-size: 12px; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="card-title">➕ Création d'un nouveau contact</div>

    <form id="contact-form" onsubmit="enregistrerContact(event)">
      <div class="section-title">👤 Identité & Profession</div>
      <div class="grid-2">
        <div class="field-group">
          <label>Nom *</label>
          <input type="text" id="add-nom" required>
        </div>
        <div class="field-group">
          <label>Prénom</label>
          <input type="text" id="add-prenom">
        </div>
      </div>

      <div class="grid-3">
        <div class="field-group">
          <label>Structure</label>
          <input type="text" id="add-structure">
        </div>
        <div class="field-group">
          <label>Fonction / Profession</label>
          <input type="text" id="add-fonction">
        </div>
        <div class="field-group">
          <label>Service</label>
          <select id="add-service"><option value="">-- Sélectionner --</option></select>
        </div>
      </div>

      <div class="grid-2">
        <div class="field-group">
          <label>Statut Juridique</label>
          <select id="add-statut"><option value="">-- Sélectionner --</option></select>
        </div>
        <div class="field-group">
          <label>Type de structure</label>
          <select id="add-type-struct"><option value="">-- Sélectionner --</option></select>
        </div>
      </div>

      <div class="section-title">📍 Adresse & Coordonnées</div>
      <div class="grid-2">
        <div class="field-group">
          <label>Code Postal</label>
          <input type="text" id="add-code-postal" oninput="chercherVille(this.value)">
        </div>
        <div class="field-group">
          <label>Ville</label>
          <input type="text" id="add-ville">
        </div>
      </div>

      <div class="grid-2">
        <div class="field-group">
          <label>Email Principal</label>
          <input type="text" id="add-email" oninput="validerEmail('add-email', 'msg-email', false)">
          <div id="msg-email" class="email-msg"></div>
        </div>
        <div class="field-group">
          <label>Emails Secondaires</label>
          <input type="text" id="add-emails-sec" placeholder="Séparés par des virgules" oninput="validerEmail('add-emails-sec', 'msg-emails-sec', true)">
          <div id="msg-emails-sec" class="email-msg"></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="field-group">
          <label>Téléphone Principal</label>
          <input type="text" id="add-tel">
        </div>
        <div class="field-group">
          <label>Téléphones Secondaires</label>
          <input type="text" id="add-tels-sec">
        </div>
      </div>

      <div class="section-title">📢 Listes de Diffusion</div>
      <div class="grid-4">
        <div class="field-group">
          <label>Cinéma</label>
          <div class="checkbox-group" id="group-cinema">Chargement...</div>
        </div>
        <div class="field-group">
          <label>Direction</label>
          <div class="checkbox-group" id="group-direction">Chargement...</div>
        </div>
        <div class="field-group">
          <label>Houdremont</label>
          <div class="checkbox-group" id="group-houdremont">Chargement...</div>
        </div>
        <div class="field-group">
          <label>Intervenant</label>
          <div class="checkbox-group" id="group-intervenant">Chargement...</div>
        </div>
      </div>

      <div class="section-title">📝 Remarques</div>
      <div class="field-group full">
        <label>Commentaire / Description</label>
        <textarea id="add-commentaire" rows="2"></textarea>
      </div>

      <button type="submit" class="btn-submit">✔ Enregistrer le contact</button>
      <div id="debug-box"></div>
    </form>
  </div>

  <script>
    let currentUser = null;
    grist.ready({ requiredAccess: 'full', columns: [] });
    grist.onUser((user) => { if (user) currentUser = user; });

    function convertirTableEnLignes(rawTable) {
      if (!rawTable || !rawTable.id) return [];
      const ids = rawTable.id || [];
      return ids.map((id, index) => {
        const row = { id };
        for (const key of Object.keys(rawTable)) {
          if (key !== 'id') row[key] = rawTable[key][index];
        }
        return row;
      });
    }

    async function chargerEtiquettes() {
      try {
        const rawTable = await grist.docApi.fetchTable('ETIQUETTES');
        const rows = convertirTableEnLignes(rawTable);

        remplirCases('group-cinema', rows, 'Listes_Diffusion_Cinema');
        remplirCases('group-direction', rows, 'Listes_Diffusion_Direction');
        remplirCases('group-houdremont', rows, 'Listes_Diffusion_Houdremont');
        
        const keys = Object.keys(rows[0] || {});
        const colInt = keys.find(k => k.toLowerCase().includes('intervenant')) || 'Listes_Diffusion_Intervenants';
        remplirCases('group-intervenant', rows, colInt);
      } catch (err) {
        console.error("Erreur ETIQUETTES :", err);
        ['group-cinema', 'group-direction', 'group-houdremont', 'group-intervenant'].forEach(id => {
          document.getElementById(id).innerHTML = `<span style="color:red; font-size:11px;">Erreur table ETIQUETTES</span>`;
        });
      }
    }

    chargerEtiquettes();

    grist.onRecords(function(records) {
      if (records && records.length > 0) {
        const extraire = (keywords) => {
          const set = new Set();
          const sampleRow = records[0];
          const matchingKeys = Object.keys(sampleRow).filter(k => 
            keywords.some(kw => k.toLowerCase().includes(kw.toLowerCase()))
          );

          records.forEach(r => {
            matchingKeys.forEach(k => {
              let val = r[k];
              if (val) String(val).split(/[,;]/).forEach(v => { if (v.trim()) set.add(v.trim()); });
            });
          });
          return Array.from(set).sort();
        };

        const alimenter = (id, keywords) => {
          const el = document.getElementById(id);
          if (!el) return;
          const cur = el.value;
          const opts = extraire(keywords);
          el.innerHTML = '<option value="">-- Sélectionner --</option>' + opts.map(o => `<option value="${o}">${o}</option>`).join('');
          el.value = cur;
        };

        alimenter('add-service', ['service']);
        alimenter('add-statut', ['statut', 'juridique']);
        alimenter('add-type-struct', ['type_de_structure', 'type_structure', 'type']);
      }
    });

    function remplirCases(containerId, rows, columnName) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';
      rows.forEach(row => {
        const val = row[columnName];
        if (val !== undefined && val !== null && val !== "") {
          container.innerHTML += `
            <label class="checkbox-item">
              <input type="checkbox" value="${row.id}"> ${val}
            </label>
          `;
        }
      });
      if (container.innerHTML === '') {
        container.innerHTML = `<span style="color:orange; font-size:11px;">Col '${columnName}' vide</span>`;
      }
    }

    async function chercherVille(cp) {
      if (/^\d{5}$/.test(cp.trim())) {
        try {
          const res = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${cp.trim()}&type=municipality&limit=1`);
          const data = await res.json();
          if (data.features && data.features.length > 0) {
            document.getElementById('add-ville').value = data.features[0].properties.city;
          }
        } catch (e) { console.error(e); }
      }
    }

    function validerEmail(inputId, msgId, multiple) {
      const input = document.getElementById(inputId);
      const msg = document.getElementById(msgId);
      if (!input || !msg) return;
      const val = input.value.trim();
      if (!val) { input.className = ''; msg.innerText = ''; return; }

      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const ok = multiple ? val.split(/[,;]/).map(e => e.trim()).filter(Boolean).every(e => regex.test(e)) : regex.test(val);

      input.className = ok ? 'valid-email' : 'invalid-email';
      msg.className = ok ? 'email-msg success' : 'email-msg error';
      msg.innerText = ok ? '✓ E-mail valide' : '✕ E-mail invalide';
    }

    async function enregistrerContact(event) {
      event.preventDefault();
      const debugBox = document.getElementById('debug-box');
      debugBox.style.display = 'none';

      const today = new Date().toISOString().split('T')[0];
      const userName = currentUser ? (currentUser.name || currentUser.email || "Utilisateur") : "Utilisateur";

      const getCoches = (id) => {
        const ids = Array.from(document.querySelectorAll(`#${id} input:checked`)).map(cb => Number(cb.value));
        return ids.length > 0 ? ['L', ...ids] : null;
      };

      const recordData = {
        NOM: document.getElementById('add-nom').value.trim(),
        PRENOM: document.getElementById('add-prenom').value.trim(),
        NOM_Structure: document.getElementById('add-structure').value.trim(),
        Fonction_Profession: document.getElementById('add-fonction').value.trim(),
        Service: document.getElementById('add-service').value || "",
        STATUT_JURIDIQUE: document.getElementById('add-statut').value || "",
        TYPE_DE_STRUCTURE_CONTACT: document.getElementById('add-type-struct').value || "",
        Code_Postal: document.getElementById('add-code-postal').value.trim(),
        Ville: document.getElementById('add-ville').value.trim(),
        EMAIL_PRINCIPAL: document.getElementById('add-email').value.trim(),
        EMAILS_SECONDAIRES: document.getElementById('add-emails-sec').value.trim(),
        Telephone_Principal: document.getElementById('add-tel').value.trim(),
        Telephones_Secondaires: document.getElementById('add-tels-sec').value.trim(),
        Commentaire_Description: document.getElementById('add-commentaire').value.trim(),
        Cree_Par: userName,
        Date_Saisie: today
      };

      const cCinema = getCoches('group-cinema');
      if (cCinema) recordData.Listes_Diffusion_Cinema = cCinema;

      const cDirection = getCoches('group-direction');
      if (cDirection) recordData.Listes_Diffusion_Direction = cDirection;

      const cHoudremont = getCoches('group-houdremont');
      if (cHoudremont) recordData.Listes_Diffusion_Houdremont = cHoudremont;

      const cIntervenant = getCoches('group-intervenant');
      if (cIntervenant) recordData.Listes_Diffusion_Intervenants = cIntervenant;

      try {
        await grist.docApi.applyUserActions([
          ['AddRecord', 'CONTACTS', -1, recordData]
        ]);
        alert('Contact enregistré avec succès !');
        document.getElementById('contact-form').reset();
        document.querySelectorAll('.email-msg').forEach(el => el.innerText = '');
        document.querySelectorAll('input').forEach(el => el.className = '');
        chargerEtiquettes();
      } catch (err) {
        console.error("Erreur Grist :", err);
        debugBox.style.display = 'block';
        debugBox.innerText = "❌ ERREUR GRIST :\n" + (err.message || JSON.stringify(err, null, 2));
      }
    }
  </script>
</body>
</html>
