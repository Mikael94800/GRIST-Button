<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .btn-custom {
      background-color: #1677ff;
      color: white;
      border: none;
      padding: 24px 36px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-custom:hover {
      background-color: #0958d9;
    }
    .btn-custom:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <button class="btn-custom" onclick="creerContact()">+ Créer un nouveau contact</button>

  <script>
    grist.ready({ requiredAccess: 'full' });

    async function creerContact() {
      try {
        // 1. Désactiver les anciens marquages dans la table CONTACTS (si besoin)
        // 2. Ajouter le nouveau contact avec la date du jour pour l'isoler
        const now = new Date().toISOString();
        const result = await grist.docApi.applyUserActions([
          ['AddRecord', 'CONTACTS', null, { 'DATE_SAISIE_CONTACTS': now }]
        ]);

        const newRowId = Array.isArray(result) ? result[0] : result;

        if (newRowId) {
          // Force le signal d'action utilisateur natif
          await grist.setCursorPos({ rowId: newRowId });
          await grist.docApi.getAccessToken({ readOnly: false });
        }
      } catch (err) {
        console.error('Erreur lors de la création du contact :', err);
      }
    }
  </script>
</body>
</html>
