<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Création d'un Contact Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 16px; background-color: #f8fafc; font-size: 15.5px; }

    .form-card { background: #ffffff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; max-width: 1000px; margin: 0 auto; }
    .card-title { font-size: 22px; font-weight: 700; color: #1f2937; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }

    .section-title { font-size: 16px; font-weight: bold; color: #111827; margin-top: 20px; margin-bottom: 12px; padding-bottom: 4px; border-bottom: 2px solid #3b82f6; display: flex; align-items: center; gap: 8px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 12px; }

    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group.full { grid-column: span 2; }
    
    label { font-size: 13px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.3px; }
    
    input[type="text"], select, textarea { padding: 9.5px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; outline: none; background-color: #fff; width: 100%; transition: all 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }

    input.invalid-email { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    input.valid-email { border-color: #10b981 !important; background-color: #f0fdf4 !important; }
    .email-msg { font-size: 11.5px; margin-top: 2px; font-weight: 600; min-height: 16px; }
    .email-msg.error { color: #dc2626; }
    .email-msg.success { color: #16a34a; }

    .checkbox-group { border: 1px solid #d1d5db; border-radius: 6px; padding: 10px 12px; background-color: #f9fafb; display: flex; flex-direction: column; gap: 8px; max-height: 160px; overflow-y: auto; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #374151; cursor: pointer; }
    .checkbox-item input[type="checkbox"] { transform: scale(1.15); cursor: pointer; }

    .actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
    .btn-submit { background-color: #15803d; color: white; border: none; padding: 14px 28px; font-size: 17px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background-color 0.2s; }
    .btn-submit:hover { background-color: #166534; }
    .btn-submit:disabled { opacity: 0.65; cursor: wait; }

    #debug-box { margin-top: 20px; padding: 12px; background: #fef2f2; border: 1px solid #ef4444; border-radius: 6px; color: #991b1b; font-family: monospace; font-size: 13px; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="card-title">➕ Création d'un nouveau contact</div>

    <form id="contact-form" onsubmit="enregistrerContact(event)">
      
      <div class="section-title">👤 Identité & Profession</div>
      <div class="grid-2">
        <div class="field-group">
          <label>Nom *</label>
          <input type="text" id="add-nom" required placeholder="ex. Dupont">
        </div>
        <div class="field-group">
          <label>Prénom</label>
          <input type="text" id="add-prenom" placeholder="ex. Marie">
        </div>
      </div>

      <div class="grid-3">
        <div class="field-group">
          <label>Structure</label>
          <input type="text" id="add-structure" placeholder="Nom de l'établissement">
        </div>
        <div class="field-group">
          <label>Fonction / Profession</label>
          <input type="text" id="add-fonction" placeholder="ex. Directrice...">
        </div>
        <div class="field-group">
          <label>Service (Origine)</label>
          <select id="add-service"><option value="">-- Sélectionner --</option></select>
        </div>
      </div>

      <div class="grid-3">
        <div class="field-group">
          <label>Statut Juridique</label>
          <select id="add-statut"><option value="">-- Sélectionner --</option></select>
        </div>
        <div class="field-group">
          <label>Type de structure</label>
          <select id="add-type-struct"><option value="">-- Sélectionner --</option></select>
        </div>
        <div class="field-group">
          <label>Domaine d'activités</label>
          <select id="add-domaine"><option value="">-- Sélectionner --</option></select>
        </div>
      </div>

      <div class="section-title">📍 Adresse & Coordonnées</div>
      <div class="field-group full">
        <label>Adresse</label>
        <input type="text" id="add-adresse" placeholder="ex. 1-3 Parvis de l'Hôtel de Ville">
      </div>
      <div class="grid-2">
        <div class="field-group">
          <label>Code Postal</label>
          <input type="text" id="add-code-postal" placeholder="ex. 93120" oninput="chercherVilleParCodePostal(this.value)">
        </div>
        <div class="field-group">
          <label>Ville</label>
          <select id="add-ville">
            <option value="">-- Saisir un code postal --</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="field-group">
          <label>Email Principal</label>
          <input type="text" id="add-email-principal" placeholder="ex. contact@domaine.fr" oninput="validerEmail('add-email-principal', 'msg-email-principal', false)">
          <div id="msg-email-principal" class="email-msg"></div>
        </div>
        <div class="field-group">
          <label>Emails Secondaires</label>
          <input type="text" id="add-emails-secondaires" placeholder="Séparés par des virgules" oninput="validerEmail('add-emails-secondaires', 'msg-emails-secondaires', true)">
          <div id="msg-emails-secondaires" class="email-msg"></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="field-group">
          <label>Téléphone Principal</label>
          <input type="text" id="add-tel-principal" placeholder="ex. 01 49 92 60 00">
        </div>
        <div class="field-group">
          <label>Téléphones Secondaires</label>
          <input type="text" id="add-tels-secondaires" placeholder="ex. 06 00 00 00 00">
        </div>
      </div>

      <div class="section-title">📢 Listes de Diffusion</div>
      <div class="grid-4">
        <div class="field-group">
          <label>Diffusion Cinéma</label>
          <div class="checkbox-group" id="group-add-cinema"></div>
        </div>

        <div class="field-group">
          <label>Diffusion Direction</label>
          <div class="checkbox-group" id="group-add-direction"></div>
        </div>

        <div class="field-group">
          <label>Diffusion Houdremont</label>
          <div class="checkbox-group" id="group-add-houdremont"></div>
        </div>

        <div class="field-group">
          <label>Diffusion Intervenant</label>
          <div class="checkbox-group" id="group-add-intervenant"></div>
        </div>
      </div>

      <div class="section-title">📝 Remarques</div>
      <div class="field-group full">
        <label>Commentaire / Description</label>
        <textarea id="add-commentaire" rows="3" placeholder="Informations complémentaires..."></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="btn-submit">✔ Valider et enregistrer la fiche</button>
      </div>

      <div id="debug-box"></div>
    </form>
  </div>

  <script>
    grist.ready({ 
      requiredAccess: 'full',
      columns: [] 
    });

    let communesCache = [];
    let enregistrementEnCours = false;

    async function initialiserFormulaire() {
      try {
        const tables = await grist.docApi.listTables();

        // 1. Chargement de la table ETIQUETTES
        if (tables.includes('ETIQUETTES')) {
          const rawEtiquettes = await grist.docApi.fetchTable('ETIQUETTES');
          const idsE = rawEtiquettes.id || [];
          const etiquettesRows = idsE.map((id, index) => {
            const row = { id };
            for (const key of Object.keys(rawEtiquettes)) {
              if (key !== 'id') row[key] = rawEtiquettes[key][index];
            }
            return row;
          });

          peuplerSelectsDepuisEtiquettes(etiquettesRows);
          peuplerCasesACocher(etiquettesRows);
        }

        // 2. Le champ Service (Origine) est une référence vers ETIQUETTES.
        //    On utilise donc directement le texte de la colonne SERVICE de ETIQUETTES
        //    comme libellé et l'id de la ligne ETIQUETTES comme valeur enregistrée.
        if (etiquettesRows.length > 0) {
          const serviceOpts = extraireOptionsColonne(etiquettesRows, [
            'SERVICE',
            'Service',
            'Service_Origine',
            'ORIGINE_CONTACT',
            'Origine_Contact'
          ]);
          peuplerSelectDirect('add-service', serviceOpts);
        }

        // 3. Chargement de la table COMMUNES_FRANCE_2026
        if (tables.includes('COMMUNES_FRANCE_2026')) {
          const rawCommunes = await grist.docApi.fetchTable('COMMUNES_FRANCE_2026');
          const idsC = rawCommunes.id || [];
          communesCache = idsC.map((id, index) => {
            return {
              id,
              nom_commune: rawCommunes.nom_commune ? rawCommunes.nom_commune[index] : '',
              code_postal: rawCommunes.code_postal ? String(rawCommunes.code_postal[index]) : ''
            };
          });

          // Si un code postal a déjà été saisi pendant le chargement, on déclenche la recherche immédiatement
          const cpInput = document.getElementById('add-code-postal');
          if (cpInput && cpInput.value.trim()) {
            chercherVilleParCodePostal(cpInput.value);
          }
        }

      } catch (err) {
        console.error("Erreur lors de l'initialisation :", err);
      }
    }

    initialiserFormulaire();

    function extraireOptionsColonne(rows, possibleKeys) {
      const map = new Map();
      rows.forEach(row => {
        for (const pk of possibleKeys) {
          if (row[pk] !== undefined && row[pk] !== null && row[pk] !== '') {
            const val = String(row[pk]).trim();
            if (val && !map.has(val)) {
              map.set(val, row.id);
            }
          }
        }
      });
      return Array.from(map.entries())
        .map(([label, id]) => ({ label, id }))
        .sort((a, b) => a.label.localeCompare(b.label));
    }

    function peuplerSelectDirect(elementId, optionsObjets) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const cur = el.value;

      // Construction DOM explicite : aucune donnée provenant de Grist
      // n'est interprétée comme du HTML.
      el.replaceChildren();
      el.appendChild(new Option('-- Sélectionner --', ''));

      optionsObjets.forEach(o => {
        const option = new Option(String(o.label), String(o.id));
        el.appendChild(option);
      });

      if (Array.from(el.options).some(option => option.value === cur)) {
        el.value = cur;
      } else {
        el.value = '';
      }
    }

    function peuplerSelectsDepuisEtiquettes(rows) {
      const statutOpts = extraireOptionsColonne(rows, ['STATUT_JURIDIQUE', 'Statut_Juridique', 'Statut']);
      peuplerSelectDirect('add-statut', statutOpts);

      const typeStructOpts = extraireOptionsColonne(rows, ['TYPE_DE_STRUCTURE / CONTACT', 'TYPE_DE_STRUCTURE_CONTACT', 'Type_De_Structure', 'Type']);
      peuplerSelectDirect('add-type-struct', typeStructOpts);

      const domaineOpts = extraireOptionsColonne(rows, ["DOMAINE D'ACTIVITES", 'DOMAINE_D_ACTIVITES', 'Domaine_Activites', 'Domaine']);
      peuplerSelectDirect('add-domaine', domaineOpts);
    }

    function peuplerCasesACocher(etiquettes) {
      const mapper = (containerId, columnName) => {
        const container = document.getElementById(containerId);
        if (!container) return;

        const checkedIds = new Set(
          Array.from(container.querySelectorAll('input:checked')).map(cb => Number(cb.value))
        );
        container.replaceChildren();

        etiquettes.forEach(row => {
          const val = row[columnName];
          if (val === undefined || val === null || String(val).trim() === '') return;

          const label = document.createElement('label');
          label.className = 'checkbox-item';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = String(row.id);
          checkbox.checked = checkedIds.has(Number(row.id));

          // Le libellé Grist est injecté uniquement comme texte.
          label.appendChild(checkbox);
          label.appendChild(document.createTextNode(' ' + String(val)));
          container.appendChild(label);
        });
      };

      mapper('group-add-cinema', 'Listes_Diffusion_Cinema');
      mapper('group-add-direction', 'Listes_Diffusion_Direction');
      mapper('group-add-houdremont', 'Listes_Diffusion_Houdremont');
      mapper('group-add-intervenant', 'Listes_Diffusion_Intervenants');
    }

    function definirOptionsVille(villeSelect, options, texteVide) {
      villeSelect.replaceChildren();
      villeSelect.appendChild(new Option(texteVide, ''));

      options.forEach(nomVille => {
        const option = new Option(String(nomVille), String(nomVille));
        villeSelect.appendChild(option);
      });
    }

    function chercherVilleParCodePostal(cp) {
      const clean = cp.trim();
      const villeSelect = document.getElementById('add-ville');
      if (!villeSelect) return;

      if (clean.length < 5) {
        definirOptionsVille(villeSelect, [], '-- Saisir un code postal --');
        return;
      }

      const matching = communesCache.filter(c => {
        const codes = c.code_postal.split(',').map(s => s.trim());
        return codes.includes(clean);
      });

      if (matching.length === 0) {
        definirOptionsVille(villeSelect, [], '-- Aucune ville trouvée --');
      } else if (matching.length === 1) {
        definirOptionsVille(villeSelect, [matching[0].nom_commune], '-- Sélectionner une ville --');
        villeSelect.value = String(matching[0].nom_commune);
      } else {
        matching.sort((a, b) => a.nom_commune.localeCompare(b.nom_commune));
        definirOptionsVille(
          villeSelect,
          matching.map(m => m.nom_commune),
          '-- Sélectionner une ville --'
        );
      }
    }

    function validerEmail(inputId, msgId, multiple) {
      const input = document.getElementById(inputId);
      const msg = document.getElementById(msgId);
      if (!input || !msg) return true;
      const val = input.value.trim();

      if (!val) {
        input.className = '';
        msg.innerText = '';
        return true;
      }

      const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      let valide = multiple 
        ? val.split(/[,;]/).map(e => e.trim()).filter(Boolean).every(e => regexEmail.test(e)) 
        : regexEmail.test(val);

      if (valide) {
        input.className = 'valid-email';
        msg.className = 'email-msg success';
        msg.innerText = '✓ Format e-mail valide';
      } else {
        input.className = 'invalid-email';
        msg.className = 'email-msg error';
        msg.innerText = '✕ Adresse e-mail invalide';
      }
      return true;
    }

    function valToNum(val) {
      return val ? Number(val) : "";
    }

    function afficherErreurValidation(message) {
      const debugBox = document.getElementById('debug-box');
      if (!debugBox) return;
      debugBox.style.display = 'block';
      debugBox.innerText = '⚠️ ' + message;
      debugBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function validerDonneesAvantEnregistrement() {
      const nom = document.getElementById('add-nom').value.trim();
      if (!nom) {
        afficherErreurValidation('Le nom du contact est obligatoire.');
        document.getElementById('add-nom').focus();
        return false;
      }

      const emailPrincipalValide = validerEmail('add-email-principal', 'msg-email-principal', false);
      const emailsSecondairesValides = validerEmail('add-emails-secondaires', 'msg-emails-secondaires', true);

      const emailPrincipal = document.getElementById('add-email-principal').value.trim();
      const emailsSecondaires = document.getElementById('add-emails-secondaires').value.trim();
      const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const principalOK = !emailPrincipal || regexEmail.test(emailPrincipal);
      const secondairesOK = !emailsSecondaires || emailsSecondaires.split(/[,;]/).map(e => e.trim()).filter(Boolean).every(e => regexEmail.test(e));

      if (!emailPrincipalValide || !emailsSecondairesValides || !principalOK || !secondairesOK) {
        afficherErreurValidation('Veuillez corriger les adresses e-mail avant l’enregistrement.');
        return false;
      }

      const cp = document.getElementById('add-code-postal').value.trim();
      if (cp && !/^\d{5}$/.test(cp)) {
        afficherErreurValidation('Le code postal doit comporter 5 chiffres, ou être laissé vide.');
        document.getElementById('add-code-postal').focus();
        return false;
      }

      return true;
    }

    async function enregistrerContact(event) {
      event.preventDefault();
      const debugBox = document.getElementById('debug-box');
      debugBox.style.display = 'none';
      debugBox.innerText = '';

      if (enregistrementEnCours) return;
      if (!validerDonneesAvantEnregistrement()) return;

      enregistrementEnCours = true;
      const submitButton = document.querySelector('.btn-submit');
      if (submitButton) {
        submitButton.disabled = true;
        submitButton.dataset.libelleOriginal = submitButton.textContent;
        submitButton.textContent = '⏳ Enregistrement en cours…';
      }

      const recordData = {
        NOM: document.getElementById('add-nom').value.trim(),
        PRENOM: document.getElementById('add-prenom').value.trim(),
        NOM_Structure: document.getElementById('add-structure').value.trim(),
        Fonction_Profession: document.getElementById('add-fonction').value.trim(),
        Service: valToNum(document.getElementById('add-service').value),
        STATUT_JURIDIQUE: valToNum(document.getElementById('add-statut').value),
        TYPE_DE_STRUCTURE_CONTACT: valToNum(document.getElementById('add-type-struct').value),
        DOMAINE_D_ACTIVITES: valToNum(document.getElementById('add-domaine').value),
        Adresse: document.getElementById('add-adresse').value.trim(),
        Code_Postal: document.getElementById('add-code-postal').value.trim(),
        Ville: document.getElementById('add-ville').value.trim(),
        EMAIL_PRINCIPAL: document.getElementById('add-email-principal').value.trim(),
        EMAILS_SECONDAIRES: document.getElementById('add-emails-secondaires').value.trim(),
        Telephone_Principal: document.getElementById('add-tel-principal').value.trim(),
        Telephones_Secondaires: document.getElementById('add-tels-secondaires').value.trim(),
        Commentaire_Description: document.getElementById('add-commentaire').value.trim()
      };

      const cinema = Array.from(document.querySelectorAll('#group-add-cinema input:checked')).map(cb => Number(cb.value));
      if (cinema.length > 0) recordData.Listes_Diffusion_Cinema = ['L', ...cinema];

      const direction = Array.from(document.querySelectorAll('#group-add-direction input:checked')).map(cb => Number(cb.value));
      if (direction.length > 0) recordData.Listes_Diffusion_Direction = ['L', ...direction];

      const houdremont = Array.from(document.querySelectorAll('#group-add-houdremont input:checked')).map(cb => Number(cb.value));
      if (houdremont.length > 0) recordData.Listes_Diffusion_Houdremont = ['L', ...houdremont];

      const intervenant = Array.from(document.querySelectorAll('#group-add-intervenant input:checked')).map(cb => Number(cb.value));
      if (intervenant.length > 0) recordData.Listes_Diffusion_Intervenants = ['L', ...intervenant];

      try {
        await grist.docApi.applyUserActions([
          ['AddRecord', 'CONTACTS', -1, recordData]
        ]);

        alert('Nouveau contact enregistré avec succès !');
        document.getElementById('contact-form').reset();
        definirOptionsVille(document.getElementById('add-ville'), [], '-- Saisir un code postal --');
        document.querySelectorAll('.email-msg').forEach(el => el.innerText = '');
        document.querySelectorAll('input').forEach(el => el.className = '');
      } catch (err) {
        console.error("Erreur Grist :", err);
        debugBox.style.display = 'block';
        debugBox.innerText = "❌ ERREUR GRIST :\n" + (err.message || JSON.stringify(err, null, 2));
      } finally {
        enregistrementEnCours = false;
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = submitButton.dataset.libelleOriginal || '✔ Valider et enregistrer la fiche';
        }
      }
    }
  </script>
</body>
</html>
