<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Création d'un Contact Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 16px; background-color: #f8fafc; font-size: 15px; }
    .form-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; max-width: 900px; margin: 0 auto; }
    .card-title { font-size: 20px; font-weight: bold; color: #1f2937; margin-bottom: 16px; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
    .section-title { font-size: 15px; font-weight: bold; color: #111827; margin-top: 16px; margin-bottom: 8px; border-bottom: 2px solid #3b82f6; padding-bottom: 4px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 8px; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 12px; font-weight: bold; color: #4b5563; text-transform: uppercase; }
    input[type="text"], select, textarea { padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; width: 100%; }
    .checkbox-group { border: 1px solid #d1d5db; border-radius: 4px; padding: 8px; background: #f9fafb; max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; }
    .btn-submit { background-color: #16a34a; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; }
    .btn-submit:hover { background-color: #15803d; }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="card-title">➕ Création d'un nouveau contact</div>

    <form id="contact-form" onsubmit="enregistrerContact(event)">
      <div class="section-title">👤 Identité</div>
      <div class="grid-2">
        <div class="field-group">
          <label>Nom *</label>
          <input type="text" id="add-nom" required>
        </div>
        <div class="field-group">
          <label>Prénom</label>
          <input type="text" id="add-prenom">
        </div>
      </div>

      <div class="grid-2">
        <div class="field-group">
          <label>Structure</label>
          <input type="text" id="add-structure">
        </div>
        <div class="field-group">
          <label>Email Principal</label>
          <input type="text" id="add-email">
        </div>
      </div>

      <div class="section-title">📢 Listes de Diffusion</div>
      <div class="grid-4">
        <div class="field-group">
          <label>Cinéma</label>
          <div class="checkbox-group" id="group-cinema">Chargement...</div>
        </div>
        <div class="field-group">
          <label>Direction</label>
          <div class="checkbox-group" id="group-direction">Chargement...</div>
        </div>
        <div class="field-group">
          <label>Houdremont</label>
          <div class="checkbox-group" id="group-houdremont">Chargement...</div>
        </div>
        <div class="field-group">
          <label>Intervenant</label>
          <div class="checkbox-group" id="group-intervenant">Chargement...</div>
        </div>
      </div>

      <button type="submit" class="btn-submit">✔ Enregistrer le contact</button>
    </form>
  </div>

  <script>
    grist.ready({ requiredAccess: 'full', columns: [] });

    // Fonction utilitaire pour convertir les données brutes Grist
    function convertirTableEnLignes(rawTable) {
      if (!rawTable || !rawTable.id) return [];
      const ids = rawTable.id || [];
      return ids.map((id, index) => {
        const row = { id };
        for (const key of Object.keys(rawTable)) {
          if (key !== 'id') row[key] = rawTable[key][index];
        }
        return row;
      });
    }

    async function chargerEtiquettes() {
      try {
        const rawTable = await grist.docApi.fetchTable('ETIQUETTES');
        const rows = convertirTableEnLignes(rawTable);

        remplirCases('group-cinema', rows, 'Listes_Diffusion_Cinema');
        remplirCases('group-direction', rows, 'Listes_Diffusion_Direction');
        remplirCases('group-houdremont', rows, 'Listes_Diffusion_Houdremont');
        remplirCases('group-intervenant', rows, 'Listes_Diffusion_Intervenants');
      } catch (err) {
        console.error("Erreur chargement ETIQUETTES :", err);
      }
    }

    function remplirCases(containerId, rows, columnName) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';

      rows.forEach(row => {
        const val = row[columnName];
        if (val !== undefined && val !== null && val !== "") {
          container.innerHTML += `
            <label class="checkbox-item">
              <input type="checkbox" value="${row.id}"> ${val}
            </label>
          `;
        }
      });

      if (container.innerHTML === '') {
        container.innerHTML = '<span style="color:red; font-size:12px;">Colonne vide/absente</span>';
      }
    }

    chargerEtiquettes();

    async function enregistrerContact(event) {
      event.preventDefault();

      const getCoches = (id) => {
        const ids = Array.from(document.querySelectorAll(`#${id} input:checked`)).map(cb => Number(cb.value));
        return ['L', ...ids];
      };

      const recordData = {
        NOM: document.getElementById('add-nom').value.trim(),
        PRENOM: document.getElementById('add-prenom').value.trim(),
        NOM_Structure: document.getElementById('add-structure').value.trim(),
        EMAIL_PRINCIPAL: document.getElementById('add-email').value.trim(),
        Listes_Diffusion_Cinema: getCoches('group-cinema'),
        Listes_Diffusion_Direction: getCoches('group-direction'),
        Listes_Diffusion_Houdremont: getCoches('group-houdremont'),
        Listes_Diffusion_Intervenants: getCoches('group-intervenant')
      };

      try {
        await grist.docApi.applyUserActions([
          ['AddRecord', 'CONTACTS', -1, recordData]
        ]);
        alert('Contact enregistré avec succès !');
        document.getElementById('contact-form').reset();
        chargerEtiquettes();
      } catch (err) {
        alert('Erreur lors de l\'enregistrement : ' + err.message);
      }
    }
  </script>
</body>
</html>
