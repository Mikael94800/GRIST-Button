<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .btn-custom {
      background-color: #1677ff;
      color: white;
      border: none;
      padding: 24px 36px;       /* Grandes dimensions internes */
      font-size: 24px;          /* Grande taille de texte */
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-custom:hover {
      background-color: #0958d9;
    }
    .btn-custom:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <button class="btn-custom" onclick="creerContact()">+ Créer un nouveau contact</button>

  <script>
    // Déclaration de l'accès et enregistrement auprès de l'API Grist
    grist.ready({
      requiredAccess: 'full',
      columns: ['id']
    });

    // Permet au widget d'être reconnu comme émetteur de sélection
    grist.onRecord(function(record) {
      // Écoute de l'enregistrement courant requise pour la liaison "SÉLECTIONNER PAR"
    });

    async function creerContact() {
      try {
        // 1. Création de la ligne dans la table CONTACTS
        const result = await grist.docApi.applyUserActions([
          ['AddRecord', 'CONTACTS', null, {}]
        ]);

        // 2. Récupération de l'ID généré
        const newRowId = Array.isArray(result) ? result[0] : result;

        if (newRowId) {
          // 3. Transmission de l'ID à la vue liée
          await grist.setSelectedRows([newRowId]);
          // 4. Déplacement du curseur global
          await grist.setCursorPos({ rowId: newRowId });
        }
      } catch (err) {
        console.error('Erreur lors de la création du contact :', err);
      }
    }
  </script>
</body>
</html>
